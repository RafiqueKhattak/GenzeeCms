; /etc/php/8.2/fpm/pool.d/genzeelogics.conf
;
; A dedicated pool so this app is fully isolated from whatever pool(s)
; Frappe/other sites on this box already use — no shared socket, no shared
; process limits.

[genzeelogics]
user = www-data
group = www-data

listen = /run/php/genzeelogics.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

php_admin_value[error_log] = /opt/apps/LaraCms/storage/logs/php-fpm-error.log
php_admin_flag[log_errors] = on
