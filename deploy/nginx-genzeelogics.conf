# /etc/nginx/sites-available/genzeelogics.com
#
# GenzeeCms production config. SSL certificates via Let's Encrypt (certbot).
# This replaces the old static-site config. Nginx + PHP-FPM (dedicated socket)
# + Inertia SSR process supervised separately.

# ----------------------------------------------------------
# HTTP -> HTTPS (everything to non-www)
# ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name genzeelogics.com www.genzeelogics.com;

    return 301 https://genzeelogics.com$request_uri;
}

# ----------------------------------------------------------
# HTTPS Redirect (www -> non-www)
# ----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.genzeelogics.com;

    ssl_certificate     /etc/letsencrypt/live/genzeelogics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genzeelogics.com/privkey.pem;

    return 301 https://genzeelogics.com$request_uri;
}

# ----------------------------------------------------------
# Main HTTPS Website (canonical: non-www)
# ----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name genzeelogics.com;

    root /opt/apps/LaraCms/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/genzeelogics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genzeelogics.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Logging
    access_log /var/log/nginx/genzeelogics.com-access.log;
    error_log  /var/log/nginx/genzeelogics.com-error.log;

    client_max_body_size 25m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Laravel routing (Inertia SSR handles all request bodies/props)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM (dedicated genzeelogics pool, isolated socket)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/genzeelogics.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    # Static assets cache aggressively
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpe?g|gif|ico|webp|webmanifest)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Hide git/env files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
