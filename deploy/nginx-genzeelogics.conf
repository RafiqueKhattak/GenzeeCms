# /etc/nginx/sites-available/genzeelogics.com
#
# Deliberately a NEW, separate server block — does not touch or reference
# any other site's config on this box. HTTP only; run certbot afterwards
# to add the HTTPS server block automatically (certbot --nginx -d
# genzeelogics.com -d www.genzeelogics.com), it edits this file in place.

server {
    listen 80;
    listen [::]:80;
    server_name genzeelogics.com www.genzeelogics.com;

    root /opt/apps/LaraCms/public;
    index index.php;

    access_log /var/log/nginx/genzeelogics.com-access.log;
    error_log  /var/log/nginx/genzeelogics.com-error.log;

    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/genzeelogics.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpe?g|gif|ico|webp|webmanifest)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
